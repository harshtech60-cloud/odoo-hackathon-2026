{% extends "auth_base.html" %}
{% from "_ui.html" import csrf, notice %}
{% block title %}Sign in{% endblock %}
{% block form %}
<div>
    <h1>Sign in</h1>
    <p class="lead">Use the email and password for your Brightloop account.</p>
</div>

{{ notice(error=error) }}

<form method="post" class="stack" style="gap:1rem" novalidate>
    {{ csrf() }}
    <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ email }}" autocomplete="username" required autofocus>
    </div>
    <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <button class="btn btn--block" type="submit">Sign in</button>
</form>

<div class="auth-links">
    <a href="{{ url_for('auth.forgot_password') }}">Forgot your password?</a>
    <a href="{{ url_for('auth.register') }}">Create a customer account</a>
</div>
{% endblock %}
